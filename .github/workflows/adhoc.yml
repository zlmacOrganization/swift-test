      - name: Archive
        working-directory: swift-test
        # env:
        #   DEVELOPMENT_TEAM: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild archive -workspace SwiftTest.xcworkspace \
            -scheme SwiftTest \
            -configuration AdHoc \
            -archivePath /Users/liangzhang/Desktop/pms_adhoc/SwiftTest.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="2B3F85ZNPD" \
            PROVISIONING_PROFILE_APP="House730PMSAdHoc" \
            PRODUCT_BUNDLE_IDENTIFIER_APP="com.house730.pms.adhoc" \
            -destination "generic/platform=iOS" \

      - name: Export IPA
        # working-directory: SwiftTest
        run: |
          xcodebuild -exportArchive \
            -archivePath /Users/liangzhang/Desktop/pms_adhoc/SwiftTest.xcarchive \
            -exportOptionsPlist /Users/liangzhang/Desktop/pms_adhoc/adhoc_ExportOptions.plist \
            -exportPath /Users/liangzhang/Desktop/pms_adhoc/SwiftTest.ipa

