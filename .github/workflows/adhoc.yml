name: AdHoc Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_IDENTIFIER: com.house730.pms.adhoc
  EXPORT_METHOD: ad-hoc

jobs:
  build-and-export:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install dependencies
        run: |
          set -e
          gem install bundler --no-document || true
          gem install cocoapods --no-document || true
          gem install xcpretty --no-document || true

      - name: CocoaPods install
        run: |
          pod install

      - name: Import signing certificate
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "Importing signing certificate"
          echo "${{ secrets.IOS_SIGNING_P12 }}" | base64 --decode > ios_cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" ios-build.keychain
          security list-keychains -s ~/Library/Keychains/ios-build.keychain
          security default-keychain -s ~/Library/Keychains/ios-build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ~/Library/Keychains/ios-build.keychain
          security import ios_cert.p12 -k ~/Library/Keychains/ios-build.keychain -P "${{ secrets.IOS_SIGNING_P12_PASSWORD }}" -T /usr/bin/codesign || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" ~/Library/Keychains/ios-build.keychain || true

      - name: Install provisioning profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile.plist
          PROFILE_UUID=$( /usr/libexec/PlistBuddy -c "Print :UUID" profile.plist )
          PROFILE_NAME=$( /usr/libexec/PlistBuddy -c "Print :Name" profile.plist )
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      - name: Archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.TEAM_ID }}
          SKIP_SWIFTLINT: 1
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive -workspace SwiftTest.xcworkspace \
            -scheme SwiftTest \
            -configuration AdHoc \
            -sdk iphoneos \
            -archivePath $PWD/build/SwiftTest.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates | xcpretty

      - name: Create exportOptions.plist
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_IDENTIFIER}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Verify archive exists
        run: |
          if [ ! -d "$PWD/build/SwiftTest.xcarchive" ]; then
            echo "ERROR: archive not found at $PWD/build/SwiftTest.xcarchive" >&2
            ls -la $PWD || true
            exit 1
          fi

      - name: Export IPA
        run: |
          set -o pipefail
          mkdir -p build/output
          xcodebuild -exportArchive \
            -archivePath $PWD/build/SwiftTest.xcarchive \
            -exportOptionsPlist $PWD/exportOptions.plist \
            -exportPath $PWD/build/output | xcpretty
          ls -la build/output

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pms-ipa
          path: build/output/*.ipa

      - name: Upload to Pgyer
        run: |
          ipaPath="$PWD/build/output/SwiftTest.ipa"
          if [ ! -f "$ipaPath" ]; then
            echo "ERROR: IPA file not found at $ipaPath" >&2
            exit 1
          fi
          echo "Uploading IPA to Pgyer..."
          curl -F "file=@$ipaPath" \
            -F "_api_key=60f055a1938d1ec2c1f01818cfd774a6" \
            https://www.pgyer.com/apiv2/app/upload

      - name: Cleanup keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security delete-keychain ios-build.keychain || true

# Required repository secrets:
# - IOS_SIGNING_P12: base64-encoded .p12 certificate
# - IOS_SIGNING_P12_PASSWORD: password for the .p12
# - KEYCHAIN_PASSWORD: password to create temporary keychain
# - PROVISIONING_PROFILE: base64-encoded .mobileprovision
# - TEAM_ID: Apple Developer Team ID
